[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "professor-pigskin-sports-predictor"
version = "1.0.0"
description = "Professor Pigskin's Sports Predictor: motor predictivo y laboratorio estadistico de futbol"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "scipy>=1.11,<2", "xgboost-cpu>=3.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["sabermetria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
