name: daily

on:
  schedule:
    # 11:00 UTC = 06:00 America/Bogota (UTC-5, sin horario de verano)
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar resultados del día anterior
        run: python -m sabermetria update --days 2

      - name: Persistir resultados nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_matches.jsonl data/live_events.jsonl
          if git diff --cached --quiet; then
            echo "Sin resultados nuevos; no se commitea."
          else
            git commit -m "data: resultados diarios $(date -u +%F)"
            git push
          fi
